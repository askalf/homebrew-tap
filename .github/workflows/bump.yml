name: bump

# Keeps Formula/dario.rb on the latest @askalf/dario from the npm registry. The rewritten
# formula is installed and tested on this runner, then proposed as a pull request from a
# bot/dario-<version> branch: main takes changes only through a pull request whose checks and
# review passed. The branch is pushed and the pull request opened with TAP_BOT_PAT, a
# fine-grained token for this repository only (contents and pull requests, read and write),
# because a pull request opened with the workflow token does not start the tests workflow.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [dario-release]

permissions: {}

concurrency: bump

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Rewrite the formula to the latest npm release
        id: bump
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          # gh attestation verify needs a token to run; it reads nothing from this repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bump-dario.sh

      - name: Install and test the rewritten formula
        if: steps.bump.outputs.changed != ''
        env:
          VERSION: ${{ steps.bump.outputs.changed }}
        run: |
          brew install --build-from-source --verbose askalf/tap/dario
          brew test --verbose askalf/tap/dario
          brew audit --strict --online askalf/tap/dario
          test "$(dario --version)" = "$VERSION"

      - name: Check out main to open the pull request from
        if: steps.bump.outputs.changed != ''
        uses: askalf/ci/actions/checkout-with-retry@9718a75899ff8774d5f6b8135ffb067fabe9dc24 # main 2026-10-29, askalf/ci#139
        with:
          path: pull-request
          token: ${{ secrets.TAP_BOT_PAT }}

      - name: Open the pull request
        if: steps.bump.outputs.changed != ''
        working-directory: pull-request
        env:
          GH_TOKEN: ${{ secrets.TAP_BOT_PAT }}
          VERSION: ${{ steps.bump.outputs.changed }}
          FORMULA: ${{ steps.set-up-homebrew.outputs.repository-path }}/Formula/dario.rb
        run: |
          branch="bot/dario-${VERSION}"
          # owner:branch matches this repository's branch only, never a fork's branch of the same name.
          url="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${branch}" --jq '.[].html_url')"
          if [[ -n "${url}" ]]; then
            echo "${url} already proposes dario ${VERSION}"
          else
            cp "${FORMULA}" Formula/dario.rb
            git checkout -b "${branch}"
            git add Formula/dario.rb
            git commit -m "dario ${VERSION}"
            git push --force origin "HEAD:refs/heads/${branch}"
            cat >"${RUNNER_TEMP}/body.md" <<EOF
          Moves \`Formula/dario.rb\` to [@askalf/dario ${VERSION}](https://www.npmjs.com/package/@askalf/dario/v/${VERSION}).

          Before this pull request was opened, the bump run checked the tarball's sha512 against the npm registry, verified its provenance (dario's \`cc-drift-auto-release.yml\` on \`master\`, on a GitHub-hosted runner), and installed, tested and audited the rewritten formula.
          EOF
            gh pr create --base main --head "${branch}" --title "dario ${VERSION}" --body-file "${RUNNER_TEMP}/body.md"
          fi

      # Best-effort cleanup: every run that read the latest npm release closes each bot/dario-*
      # pull request for any other version, also when main already has that version and also
      # when a later step of this run failed. Between runs (six hours) an older pull request
      # stays open; tests.yml's latest check refuses it once a newer bump merged, but not when
      # only npm moved, so it can still merge one release behind until it is closed here. It
      # never takes main backwards. Every page of open pull requests is read before any is
      # closed (gh pr list stops at 30, and closing while paging shifts later ones onto pages
      # already read), and only this repository's own branches count, so a fork's bot/dario-*
      # branch is never closed or deleted.
      - name: Close superseded pull requests
        if: ${{ !cancelled() && steps.bump.outputs.latest != '' }}
        env:
          GH_TOKEN: ${{ secrets.TAP_BOT_PAT }}
          LATEST: ${{ steps.bump.outputs.latest }}
        run: |
          prs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY and (.head.ref | startswith("bot/dario-"))) | "\(.number) \(.head.ref)"')"
          while read -r number head; do
            if [[ -n "${number}" && "${head}" != "bot/dario-${LATEST}" ]]; then
              gh pr close "${number}" --repo "${GITHUB_REPOSITORY}" --delete-branch \
                --comment "Superseded: dario ${LATEST} is the latest release on npm."
            fi
          done <<<"${prs}"
