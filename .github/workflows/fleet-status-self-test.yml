# Checks this repository's fleet-status workflows with askalf/ci's fleet-status-check action: the
# refresh list in fleet-status.yml against every workflow that runs on pull requests, the status
# job's if: against fork and same-repo events, every runs-on that names our runner label, and the
# review relay. The workflows are read as text from the PR's checkout with a read-only token;
# nothing in them runs. The paths are every file the check reads.
# self-test is not a required check here, so a PR that touches none of them runs nothing.
name: Fleet status self-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/**

permissions: {}

jobs:
  self-test:
    # This repository has no exec runner row, so the job runs on GitHub's runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@e6a0901235a1d880cf620d23eece2ba63bd042f9 # main 2026-10-25, askalf/ci#135
        with:
          persist-credentials: false

      - uses: askalf/ci/actions/fleet-status-check@e6a0901235a1d880cf620d23eece2ba63bd042f9 # main 2026-10-25, askalf/ci#135
        with:
          min-own-exprs: '0'
