# Checks this repository's fleet-status workflows with askalf/ci's fleet-status-check action: the
# refresh list in fleet-status.yml against every workflow that runs on pull requests, the status
# job's if: against fork and same-repo events, every runs-on that names our runner label, and the
# review relay. The workflows are read as text from the PR's checkout with a read-only token;
# nothing in them runs. The paths are every file the check reads.
# self-test is not a required check here, so a PR that touches none of them runs nothing.
# min-own-exprs counts the expressions that send a fork's PR to GitHub's runners: only this job's,
# since tests and bump run on GitHub's runners and the status and backfill jobs run ours for every
# event. So the floor is 1 here, not 5.
name: Fleet status self-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/**

permissions: {}

jobs:
  self-test:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on homebrew-tap-exec, our non-root
    # one-job runners, so GitHub's hosted queue going down does not hold our PRs. A fork's PR
    # and a Dependabot PR run code nobody here wrote, and a fork repository has no homebrew-tap-exec
    # runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/homebrew-tap' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","homebrew-tap-exec"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@e6a0901235a1d880cf620d23eece2ba63bd042f9 # main 2026-10-25, askalf/ci#135
        with:
          persist-credentials: false

      - uses: askalf/ci/actions/fleet-status-check@e6a0901235a1d880cf620d23eece2ba63bd042f9 # main 2026-10-25, askalf/ci#135
        with:
          min-own-exprs: '1'
