name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tap syntax
        run: |
          brew readall askalf/tap
          brew style askalf/tap

      - name: Install from source
        run: brew install --build-from-source --verbose askalf/tap/dario

      - name: Test
        run: brew test --verbose askalf/tap/dario

      - name: Audit
        run: brew audit --strict --online askalf/tap/dario

      - name: Installed version matches the formula
        run: |
          installed="$(dario --version)"
          formula="$(brew info --json=v2 askalf/tap/dario | jq -r '.formulae[0].versions.stable')"
          test "$installed" = "$formula"

  # The bytes the formula pins must carry dario's release provenance, the same check bump.yml
  # makes before it commits a new version.
  provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@e6a0901235a1d880cf620d23eece2ba63bd042f9 # main 2026-10-25, askalf/ci#135
        with:
          persist-credentials: false

      - name: Formula tarball provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="$(sed -nE 's#^ *url "(.*)"$#\1#p' Formula/dario.rb)"
          sha256="$(sed -nE 's#^ *sha256 "([0-9a-f]{64})"$#\1#p' Formula/dario.rb)"
          version="$(sed -nE 's#.*dario-([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)\.tgz.*#\1#p' <<<"$url")"
          test -n "$url"
          test -n "$sha256"
          test -n "$version"
          work="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$work/dario.tgz" "$url"
          echo "$sha256  $work/dario.tgz" | sha256sum -c -
          bash scripts/verify-dario-provenance.sh "$version" "$work/dario.tgz"
